[project]
name = "ugmb-vlyc"
version = "0.6.0"
description = "uvmb-vlyc: UGMathBench variant LYC."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "antlr4-python3-runtime==4.11",
    "backoff>=2.2.1",
    "chardet>=7.4.3",
    "datasets>=5.0.0",
    "dotenv>=0.9.9",
    "langchain-core>=1.4.8",
    "mcma",
    "numpy>=2.5.0",
    "openai>=2.44.0",
    "requests>=2.34.2",
    "tqdm>=4.68.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["ugmb_vlyc"]

[tool.uv.sources]
mcma = { path = "../agents", editable = true }

[dependency-groups]
dev = [
    "pyreadline3>=3.5.6",
    "ruff>=0.16.1",
    "ty>=0.0.65",
]
